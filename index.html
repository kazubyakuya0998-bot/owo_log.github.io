<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>MY LOG</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

:root{
  --bg:#f3f0e8;
  --paper:#fffdf8;
  --paper2:#f8f5ed;
  --ink:#252525;
  --muted:#77736b;
  --line:#d9d4c8;
  --accent:#252525;
  --danger:#a44;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
  background:var(--bg);
  color:var(--ink);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

body{
  padding-bottom:80px;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

input,
textarea,
select{
  width:100%;
  border:1px solid var(--line);
  background:white;
  border-radius:10px;
  padding:11px 12px;
  outline:none;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#777;
}

textarea{
  min-height:110px;
  resize:vertical;
}

.hidden{
  display:none!important;
}

/* =========================
   LOGIN
========================= */

#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.login-card{
  width:100%;
  max-width:420px;
  background:var(--paper);
  border:1px solid var(--line);
  padding:30px 24px;
  border-radius:18px;
  box-shadow:0 8px 30px rgba(0,0,0,.05);
}

.login-logo{
  text-align:center;
  font-size:30px;
  letter-spacing:.18em;
  font-weight:700;
  margin-bottom:8px;
}

.login-sub{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  margin-bottom:28px;
}

.login-label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin:15px 0 6px;
}

.login-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:20px;
}

.btn{
  border:1px solid var(--ink);
  background:var(--ink);
  color:white;
  border-radius:10px;
  padding:11px 14px;
  font-weight:700;
}

.btn.secondary{
  background:white;
  color:var(--ink);
}

.btn.light{
  background:var(--paper2);
  color:var(--ink);
  border-color:var(--line);
}

.btn.danger{
  background:white;
  color:var(--danger);
  border-color:#caa;
}

.btn.small{
  padding:7px 10px;
  font-size:12px;
}

.login-message{
  margin-top:14px;
  min-height:20px;
  font-size:12px;
  color:var(--danger);
  text-align:center;
}

/* =========================
   APP
========================= */

#app{
  display:none;
}

.app-header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(243,240,232,.96);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}

.header-inner{
  max-width:1000px;
  margin:auto;
  padding:14px 16px 10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.logo{
  font-size:20px;
  font-weight:800;
  letter-spacing:.12em;
}

.sync-status{
  font-size:10px;
  color:var(--muted);
  white-space:nowrap;
}

#nav{
  max-width:1000px;
  margin:auto;
  display:flex;
  overflow-x:auto;
  gap:4px;
  padding:0 10px 10px;
  scrollbar-width:none;
}

#nav::-webkit-scrollbar{
  display:none;
}

.nav-btn{
  flex:0 0 auto;
  border:0;
  background:transparent;
  color:var(--muted);
  padding:8px 11px;
  border-radius:8px;
  font-size:11px;
}

.nav-btn.active{
  background:var(--ink);
  color:white;
}

.main{
  max-width:1000px;
  margin:auto;
  padding:18px 14px 40px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.page-title{
  font-size:25px;
  font-weight:800;
  letter-spacing:.05em;
  margin:4px 0 18px;
}

.page-sub{
  color:var(--muted);
  font-size:11px;
  margin-top:-12px;
  margin-bottom:18px;
}

/* =========================
   CARDS
========================= */

.card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:14px;
  padding:15px;
  margin-bottom:12px;
}

.card-title{
  font-size:12px;
  font-weight:800;
  letter-spacing:.08em;
  margin-bottom:10px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}

.stat{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:12px;
  padding:14px;
}

.stat-label{
  color:var(--muted);
  font-size:10px;
  margin-bottom:6px;
}

.stat-value{
  font-size:23px;
  font-weight:800;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

@media(max-width:600px){
  .grid2{
    grid-template-columns:1fr;
  }
}

.row{
  display:flex;
  align-items:center;
  gap:8px;
}

.between{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.wrap{
  flex-wrap:wrap;
}

.muted{
  color:var(--muted);
}

.small-text{
  font-size:11px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:22px 10px;
  font-size:12px;
}

/* =========================
   HOME
========================= */

.home-date{
  font-size:13px;
  color:var(--muted);
  margin-bottom:5px;
}

.home-today{
  font-size:30px;
  font-weight:800;
  margin-bottom:20px;
}

.home-list{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.home-item{
  padding:10px 11px;
  background:var(--paper2);
  border-radius:9px;
  border-left:3px solid var(--ink);
}

.home-item-title{
  font-weight:700;
  font-size:13px;
}

.home-item-sub{
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
}

/* =========================
   WEEK
========================= */

.week-controls{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:12px;
}

.week-label{
  font-weight:800;
  font-size:14px;
}

.week-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
  overflow-x:auto;
}

.week-day{
  min-width:0;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:9px;
  min-height:145px;
  padding:7px;
}

.week-day-head{
  text-align:center;
  border-bottom:1px solid var(--line);
  padding-bottom:6px;
  margin-bottom:6px;
}

.week-day-name{
  font-size:9px;
  color:var(--muted);
}

.week-day-number{
  font-size:16px;
  font-weight:800;
}

.week-event{
  font-size:9px;
  background:var(--paper2);
  border-radius:5px;
  padding:5px;
  margin-bottom:4px;
  cursor:pointer;
}

.week-event-time{
  color:var(--muted);
  font-size:8px;
}

@media(max-width:700px){
  .week-grid{
    grid-template-columns:repeat(7,minmax(100px,1fr));
    overflow-x:auto;
    padding-bottom:5px;
  }
}

/* =========================
   LIST ITEMS
========================= */

.list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.item{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
}

.item.done{
  opacity:.55;
}

.item.done .item-title{
  text-decoration:line-through;
}

.item-title{
  font-size:13px;
  font-weight:800;
}

.item-detail{
  margin-top:5px;
  font-size:11px;
  color:var(--muted);
  white-space:pre-wrap;
}

.item-meta{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:8px;
}

.tag{
  display:inline-block;
  padding:4px 7px;
  border-radius:999px;
  background:var(--paper2);
  color:var(--muted);
  font-size:9px;
}

.item-actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  margin-top:10px;
}

.star{
  letter-spacing:1px;
}

.photo{
  display:block;
  width:100%;
  max-height:240px;
  object-fit:cover;
  border-radius:9px;
  margin-top:10px;
}

/* =========================
   FORMS
========================= */

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

@media(max-width:600px){
  .form-grid{
    grid-template-columns:1fr;
  }
}

.form-group{
  margin-bottom:10px;
}

.form-label{
  display:block;
  font-size:10px;
  font-weight:800;
  color:var(--muted);
  margin-bottom:5px;
}

.form-full{
  grid-column:1 / -1;
}

.check-row{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
}

.check-row input{
  width:auto;
}

/* =========================
   RECEIPT
========================= */

.receipt{
  max-width:600px;
  margin:auto;
  background:#fff;
  border:1px solid #ccc;
  padding:24px 20px;
  position:relative;
}

.receipt:after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-8px;
  height:8px;
  background:
    linear-gradient(
      -45deg,
      transparent 5px,
      #fff 0
    ) 0 0/10px 10px repeat-x;
}

.receipt-header{
  text-align:center;
  padding-bottom:15px;
  border-bottom:1px dashed #aaa;
  margin-bottom:15px;
}

.receipt-title{
  font-weight:900;
  letter-spacing:.15em;
}

.receipt-row{
  display:flex;
  justify-content:space-between;
  padding:8px 0;
  border-bottom:1px dotted #ccc;
  font-size:12px;
}

.receipt-total{
  font-size:18px;
  font-weight:900;
  padding-top:14px;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:rgba(0,0,0,.35);
  padding:12px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:600px;
  max-height:90vh;
  overflow:auto;
  background:var(--paper);
  border-radius:18px 18px 10px 10px;
  padding:18px;
}

.modal-title{
  font-size:18px;
  font-weight:800;
  margin-bottom:16px;
}

.modal-actions{
  display:flex;
  gap:7px;
  justify-content:flex-end;
  margin-top:16px;
  flex-wrap:wrap;
}

/* =========================
   FOOTER
========================= */

.app-footer{
  text-align:center;
  color:var(--muted);
  font-size:9px;
  padding:30px 0;
}

/* =========================
   PRINT
========================= */

@media print{
  body{
    background:white;
    padding:0;
  }

  .app-header,
  .app-footer,
  .no-print{
    display:none!important;
  }

  .main{
    padding:0;
    max-width:none;
  }

  #receipt{
    display:block!important;
  }

  .receipt{
    border:0;
    box-shadow:none;
  }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN SCREEN
========================= -->

<section id="loginScreen">

  <div class="login-card">

    <div class="login-logo">MY LOG</div>

    <div class="login-sub">
      YOUR PERSONAL RECORD
    </div>

    <label class="login-label">
      ユーザー名
    </label>

    <input
      id="loginUsername"
      type="text"
      maxlength="30"
      autocomplete="username"
      placeholder="ユーザー名"
    >

    <label class="login-label">
      パスワード
    </label>

    <input
      id="loginPassword"
      type="password"
      autocomplete="current-password"
      placeholder="8文字以上"
    >

    <div class="login-actions">

      <button
        class="btn"
        type="button"
        onclick="login()"
      >
        ログイン
      </button>

      <button
        class="btn secondary"
        type="button"
        onclick="signup()"
      >
        新規登録
      </button>

    </div>

    <div
      id="loginMessage"
      class="login-message"
    ></div>

  </div>

</section>

<!-- =========================
     APP
========================= -->

<div id="app">

  <header class="app-header">

    <div class="header-inner">

      <div class="logo">
        MY LOG
      </div>

      <div class="row">

        <span
          id="syncStatus"
          class="sync-status"
        >
          OFFLINE
        </span>

        <button
          class="btn light small"
          type="button"
          onclick="logout()"
        >
          LOGOUT
        </button>

      </div>

    </div>

    <nav id="nav"></nav>

  </header>

  <main class="main">

    <!-- =====================
         HOME
    ====================== -->

    <section
      id="home"
      class="page active"
    >

      <div class="page-title">
        HOME
      </div>

      <div
        id="homeDate"
        class="home-date"
      ></div>

      <div
        id="homeToday"
        class="home-today"
      ></div>

      <div class="stats">

        <div class="stat">

          <div class="stat-label">
            OPEN TODO
          </div>

          <div
            id="statTodo"
            class="stat-value"
          >
            0
          </div>

        </div>

        <div class="stat">

          <div class="stat-label">
            STUDY TODAY
          </div>

          <div
            id="statStudy"
            class="stat-value"
          >
            0m
          </div>

        </div>

        <div class="stat">

          <div class="stat-label">
            SPENDING TODAY
          </div>

          <div
            id="statMoney"
            class="stat-value"
          >
            ¥0
          </div>

        </div>

        <div class="stat">

          <div class="stat-label">
            EVENTS THIS WEEK
          </div>

          <div
            id="statEvents"
            class="stat-value"
          >
            0
          </div>

        </div>

      </div>

      <div class="card" style="margin-top:14px">

        <div class="between">

          <div class="card-title">
            TODAY'S EVENTS
          </div>

          <button
            class="btn light small"
            type="button"
            onclick="showPage('week')"
          >
            WEEK
          </button>

        </div>

        <div
          id="homeEvents"
          class="home-list"
        ></div>

      </div>

      <div class="card">

        <div class="between">

          <div class="card-title">
            TODO
          </div>

          <button
            class="btn light small"
            type="button"
            onclick="showPage('todo')"
          >
            TODO
          </button>

        </div>

        <div
          id="homeTodos"
          class="home-list"
        ></div>

      </div>

      <div class="card">

        <div class="between">

          <div class="card-title">
            RECENT RECORD
          </div>

          <button
            class="btn light small"
            type="button"
            onclick="showPage('record')"
          >
            RECORD
          </button>

        </div>

        <div
          id="homeRecords"
          class="home-list"
        ></div>

      </div>

    </section>

    <!-- =====================
         WEEK
    ====================== -->

    <section
      id="week"
      class="page"
    >

      <div class="page-title">
        WEEK
      </div>

      <div class="week-controls">

        <button
          class="btn light small"
          type="button"
          onclick="changeWeek(-1)"
        >
          ← 前週
        </button>

        <div
          id="weekLabel"
          class="week-label"
        ></div>

        <button
          class="btn light small"
          type="button"
          onclick="changeWeek(1)"
        >
          次週 →
        </button>

      </div>

      <div
        id="weekGrid"
        class="week-grid"
      ></div>

      <div class="card" style="margin-top:14px">

        <div class="between">

          <div class="card-title">
            WEEK TODO
          </div>

          <button
            class="btn small"
            type="button"
            onclick="openTodoModal()"
          >
            + TODO
          </button>

        </div>

        <div
          id="weekTodos"
          class="list"
        ></div>

      </div>

    </section>

    <!-- =====================
         TODO
    ====================== -->

    <section
      id="todo"
      class="page"
    >

      <div class="between">

        <div class="page-title">
          TODO
        </div>

        <button
          class="btn small"
          type="button"
          onclick="openTodoModal()"
        >
          + ADD
        </button>

      </div>

      <div
        id="todoList"
        class="list"
      ></div>

    </section>

    <!-- =====================
         MONEY
    ====================== -->

    <section
      id="money"
      class="page"
    >

      <div class="between">

        <div class="page-title">
          MONEY
        </div>

        <button
          class="btn small"
          type="button"
          onclick="openMoneyModal()"
        >
          + ADD
        </button>

      </div>

      <div class="stats">

        <div class="stat">

          <div class="stat-label">
            TOTAL
          </div>

          <div
            id="moneyTotal"
            class="stat-value"
          >
            ¥0
          </div>

        </div>

        <div class="stat">

          <div class="stat-label">
            THIS MONTH
          </div>

          <div
            id="moneyMonth"
            class="stat-value"
          >
            ¥0
          </div>

        </div>

      </div>

      <div
        id="moneyList"
        class="list"
        style="margin-top:14px"
      ></div>

    </section>

    <!-- =====================
         WISH
    ====================== -->

    <section
      id="wish"
      class="page"
    >

      <div class="between">

        <div class="page-title">
          WISH
        </div>

        <button
          class="btn small"
          type="button"
          onclick="openWishModal()"
        >
          + ADD
        </button>

      </div>

      <div
        id="wishList"
        class="list"
      ></div>

    </section>

    <!-- =====================
         MEMO
    ====================== -->

    <section
      id="memo"
      class="page"
    >

      <div class="between">

        <div class="page-title">
          MEMO
        </div>

        <button
          class="btn small"
          type="button"
          onclick="openMemoModal()"
        >
          + ADD
        </button>

      </div>

      <div
        id="memoList"
        class="list"
      ></div>

    </section>

    <!-- =====================
         RECORD
    ====================== -->

    <section
      id="record"
      class="page"
    >

      <div class="between">

        <div class="page-title">
          RECORD
        </div>

        <button
          class="btn small"
          type="button"
          onclick="openRecordModal()"
        >
          + ADD
        </button>

      </div>

      <div
        id="recordList"
        class="list"
      ></div>

    </section>

    <!-- =====================
         RECEIPT
    ====================== -->

    <section
      id="receipt"
      class="page"
    >

      <div class="between no-print">

        <div class="page-title">
          RECEIPT
        </div>

        <button
          class="btn small"
          type="button"
          onclick="printReceipt()"
        >
          PRINT / PDF
        </button>

      </div>

      <div
        id="receiptBody"
        class="receipt"
      ></div>

    </section>

  </main>

  <footer class="app-footer">
    MY LOG · PERSONAL RECORD SYSTEM
  </footer>

</div>

<!-- =========================
     COMMON MODAL
========================= -->

<div
  id="modal"
  class="modal"
  onclick="closeModalByBackground(event)"
>

  <div class="modal-box">

    <div
      id="modalTitle"
      class="modal-title"
    ></div>

    <div id="modalBody"></div>

  </div>

</div>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://xjanjhywkozjohxultta.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_ICkqvGWwyLdz5_rPE7YCCg_yyoqIL0v";

const sb =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let currentUsername = "";

let events = [];
let todos = [];
let money = [];
let wishes = [];
let notes = [];
let records = [];

let weekOffset = 0;

let editingEventId = null;
let editingTodoId = null;
let editingMoneyId = null;
let editingWishId = null;
let editingMemoId = null;
let editingRecordId = null;

let selectedEventColor = "#252525";

let saveQueue = Promise.resolve();

/* =========================================================
   BASIC HELPERS
========================================================= */

function uid(){

  if(
    window.crypto &&
    typeof window.crypto.randomUUID === "function"
  ){
    return window.crypto.randomUUID();
  }

  return (
    Date.now().toString(36) +
    Math.random().toString(36).slice(2)
  );
}

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function localDateString(date=new Date()){

  const y = date.getFullYear();

  const m = String(
    date.getMonth()+1
  ).padStart(2,"0");

  const d = String(
    date.getDate()
  ).padStart(2,"0");

  return `${y}-${m}-${d}`;
}

function dateKey(date=new Date()){
  return localDateString(date);
}

function parseDate(str){

  const [y,m,d] =
    String(str).split("-").map(Number);

  return new Date(
    y,
    (m||1)-1,
    d||1
  );
}

function addDays(date, amount){

  const d = new Date(date);

  d.setDate(
    d.getDate()+amount
  );

  return d;
}

function formatDateJP(str){

  if(!str)return "";

  const d = parseDate(str);

  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
}

function formatDateTime(dateStr,timeStr){

  if(!dateStr)return "";

  if(!timeStr){
    return formatDateJP(dateStr);
  }

  return `${formatDateJP(dateStr)} ${timeStr}`;
}

function setSync(text){

  const el =

}

/* =========================================================
   AUTH HELPERS
========================================================= */

function normalizeUsername(username){

  return String(username || "")
    .trim()
    .toLowerCase();
}

async function usernameToEmail(username){

  const normalized =
    normalizeUsername(username);

  const buffer =
    new TextEncoder().encode(normalized);

  const hashBuffer =
    await crypto.subtle.digest(
      "SHA-256",
      buffer
    );

  const hashArray =
    Array.from(
      new Uint8Array(hashBuffer)
    );

  const hash =
    hashArray
      .map(
        b => b.toString(16).padStart(2,"0")
      )
      .join("");

  return `u_${hash}@mylog.local`;
}

function validateUsername(username){

  const value =
    String(username || "").trim();

  if(!value){
    return "ユーザー名を入力してください。";
  }

  if(value.length < 2){
    return "ユーザー名は2文字以上にしてください。";
  }

  if(value.length > 30){
    return "ユーザー名は30文字以内にしてください。";
  }

  return "";
}

function validatePassword(password){

  if(!password){
    return "パスワードを入力してください。";
  }

  if(password.length < 8){
    return "パスワードは8文字以上にしてください。";
  }

  return "";
}

/* =========================================================
   SIGN UP
========================================================= */

async function signup(){

  showLoginMessage("");

  const username =
    document
      .getElementById("loginUsername")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;

  const usernameError =
    validateUsername(username);

  if(usernameError){
    showLoginMessage(usernameError);
    return;
  }

  const passwordError =
    validatePassword(password);

  if(passwordError){
    showLoginMessage(passwordError);
    return;
  }

  try{

    showLoginMessage(
      "登録しています…"
    );

    const normalized =
      normalizeUsername(username);

    const {data:available,error:checkError} =
      await sb.rpc(
        "username_available",
        {
          p_username:normalized
        }
      );

    if(checkError){
      throw checkError;
    }

    if(available === false){
      showLoginMessage(
        "そのユーザー名はすでに使われています。"
      );
      return;
    }

    const email =
      await usernameToEmail(username);

    const {data,error} =
      await sb.auth.signUp({
        email,
        password,
        options:{
          data:{
            username:username
          }
        }
      });

    if(error){
      throw error;
    }

    if(!data.user){
      throw new Error(
        "ユーザー登録に失敗しました。"
      );
    }

    showLoginMessage(
      "登録しました。ログインしています…"
    );

    await enterApp(data.user);

  }catch(error){

    console.error(error);

    showLoginMessage(
      authErrorMessage(error)
    );
  }
}

/* =========================================================
   LOGIN
========================================================= */

async function login(){

  showLoginMessage("");

  const username =
    document
      .getElementById("loginUsername")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;

  const usernameError =
    validateUsername(username);

  if(usernameError){
    showLoginMessage(usernameError);
    return;
  }

  if(!password){
    showLoginMessage(
      "パスワードを入力してください。"
    );
    return;
  }

  try{

    showLoginMessage(
      "ログインしています…"
    );

    const email =
      await usernameToEmail(username);

    const {data,error} =
      await sb.auth.signInWithPassword({
        email,
        password
      });

    if(error){
      throw error;
    }

    if(!data.user){
      throw new Error(
        "ログインできませんでした。"
      );
    }

    await enterApp(data.user);

  }catch(error){

    console.error(error);

    showLoginMessage(
      authErrorMessage(error)
    );
  }
}

function authErrorMessage(error){

  const msg =
    String(
      error?.message ||
      error ||
      ""
    );

  if(
    msg.toLowerCase().includes(
      "invalid login credentials"
    )
  ){
    return "ユーザー名またはパスワードが違います。";
  }

  if(
    msg.toLowerCase().includes(
      "user already registered"
    )
  ){
    return "そのユーザー名はすでに登録されています。";
  }

  if(
    msg.toLowerCase().includes(
      "password should be at least"
    )
  ){
    return "パスワードは8文字以上にしてください。";
  }

  return "エラーが発生しました："+msg;
}

async function loadCloud(){

  if(!currentUser){
    return;
  }

  try{

    const {data,error} =
      await sb
        .from("mylog_data")
        .select("*")
        .eq("user_id",currentUser.id)
        .maybeSingle();

    if(error){
      console.error("LOAD ERROR",error);
      setSync("ERROR");
      throw new Error(
        "データ読み込みエラー: " +
        (error.message || error.code || "unknown")
      );
    }

    if(data){

      events =
        Array.isArray(data.events)
          ? data.events
          : [];

      todos =
        Array.isArray(data.todos)
          ? data.todos
          : [];

      money =
        Array.isArray(data.money)
          ? data.money
          : [];

      wishes =
        Array.isArray(data.wishes)
          ? data.wishes
          : [];

      notes =
        Array.isArray(data.notes)
          ? data.notes
          : [];

      records =
        Array.isArray(data.records)
          ? data.records
          : [];

    }else{

      events = [];
      todos = [];
      money = [];
      wishes = [];
      notes = [];
      records = [];

    }

    setSync("SYNCED");

  }catch(error){

    console.error(error);
    setSync("ERROR");

    alert(
      error.message ||
      "データの読み込みに失敗しました。"
    );
  }
}

/* =========================================================
   SAVE
========================================================= */

async function saveCloudNow(){

  if(!currentUser){
    return false;
  }

  setSync("SAVING");

  const payload = {
    user_id:currentUser.id,
    events:events,
    todos:todos,
    money:money,
    wishes:wishes,
    notes:notes,
    records:records,
    updated_at:new Date().toISOString()
  };

  try{

    /*
      まずUPDATE。

      signup時にSupabase側のtriggerで
      mylog_dataの行が作られるので、
      通常はこちらで保存できる。
    */

    const {
      data:updated,
      error:updateError
    } =
      await sb
        .from("mylog_data")
        .update(payload)
        .eq("user_id",currentUser.id)
        .select("user_id")
        .maybeSingle();

    if(updateError){

      console.error(
        "UPDATE ERROR",
        updateError
      );

      throw new Error(
        "保存エラー: " +
        (
          updateError.message ||
          updateError.code ||
          "unknown error"
        )
      );
    }

    /*
      もし行が存在しなかった場合だけINSERT。
    */

    if(!updated){

      const {
        error:insertError
      } =
        await sb
          .from("mylog_data")
          .insert(payload);

      if(insertError){

        console.error(
          "INSERT ERROR",
          insertError
        );

        throw new Error(
          "初回保存エラー: " +
          (
            insertError.message ||
            insertError.code ||
            "unknown error"
          )
        );
      }
    }

    setSync("SYNCED");

    return true;

  }catch(error){

    console.error(error);

    setSync("ERROR");

    throw error;
  }
}

/*
  保存を順番待ちにする。

  例えば連続してTODOを編集しても、
  保存処理がぶつからないようにする。
*/

function saveAll(){

  if(!currentUser){
    return Promise.resolve(false);
  }

  saveQueue =
    saveQueue
      .catch(()=>{
        /*
          前回の保存が失敗していても、
          次の保存を止めない。
        */
      })
      .then(
        ()=>saveCloudNow()
      );

  return saveQueue;
}

/* =========================================================
   LOCAL STORAGE
   旧データ移行用
========================================================= */

function getLocalData(){

  function read(key){

    try{

      const raw =
        localStorage.getItem(key);

      if(!raw){
        return [];
      }

      const parsed =
        JSON.parse(raw);

      return Array.isArray(parsed)
        ? parsed
        : [];

    }catch(error){

      console.error(
        "LOCAL READ ERROR",
        key,
        error
      );

      return [];
    }
  }

  return {

    events:read("mylog_events"),

    todos:read("mylog_todos"),

    money:read("mylog_money"),

    wishes:read("mylog_wishes"),

    notes:read("mylog_notes"),

    records:read("mylog_records")

  };
}

/* =========================================================
   OLD DATA MIGRATION
========================================================= */

async function migrateOldData(){

  if(!currentUser){

    alert(
      "先にログインしてください。"
    );

    return;
  }

  const old =
    getLocalData();

  const count =
    old.events.length +
    old.todos.length +
    old.money.length +
    old.wishes.length +
    old.notes.length +
    old.records.length;

  if(count === 0){

    alert(
      "この端末のブラウザには、移行できる旧データがありませんでした。"
    );

    return;
  }

  const ok =
    confirm(
      "この端末に残っている旧データを、現在のアカウントへ移行しますか？\n\n" +
      `イベント：${old.events.length}\n` +
      `TODO：${old.todos.length}\n` +
      `お金：${old.money.length}\n` +
      `WISH：${old.wishes.length}\n` +
      `MEMO：${old.notes.length}\n` +
      `RECORD：${old.records.length}\n\n` +
      "現在のクラウドデータに追加します。"
    );

  if(!ok){
    return;
  }

  try{

    setSync("IMPORT");

    /*
      IDが同じものは重複させない。
    */

    function mergeArrays(current,oldItems){

      const result =
        Array.isArray(current)
          ? [...current]
          : [];

      const ids =
        new Set(
          result.map(item=>item.id)
        );

      oldItems.forEach(item=>{

        const copy = {
          ...item
        };

        if(!copy.id){
          copy.id = uid();
        }

        if(!ids.has(copy.id)){

          result.push(copy);
          ids.add(copy.id);

        }

      });

      return result;
    }

    events =
      mergeArrays(
        events,
        old.events
      );

    todos =
      mergeArrays(
        todos,
        old.todos
      );

    money =
      mergeArrays(
        money,
        old.money
      );

    wishes =
      mergeArrays(
        wishes,
        old.wishes
      );

    notes =
      mergeArrays(
        notes,
        old.notes
      );

    records =
      mergeArrays(
        records,
        old.records
      );

    const saved =
      await saveCloudNow();

    if(saved){

      renderAll();

      alert(
        "旧データの移行が完了しました。"
      );
    }

  }catch(error){

    console.error(error);

    alert(
      error.message ||
      "旧データの移行に失敗しました。"
    );

  }

}

/* =========================================================
   DATA SORT HELPERS
========================================================= */

function sortByDateAsc(a,b){

  const ad =
    String(
      a.date ||
      a.createdAt ||
      ""
    );

  const bd =
    String(
      b.date ||
      b.createdAt ||
      ""
    );

  return ad.localeCompare(bd);
}

function sortByDateDesc(a,b){

  return -sortByDateAsc(a,b);
}

/* =========================================================
   EVENT HELPERS
========================================================= */

function getEventsForDate(date){

  return events
    .filter(event=>event.date === date)
    .sort((a,b)=>{

      /*
        終日イベントを先にする。
      */

      if(!!a.allDay !== !!b.allDay){
        return a.allDay ? -1 : 1;
      }

      return String(
        a.time || ""
      ).localeCompare(
        String(b.time || "")
      );

    });
}

/* =========================================================
   WEEK
========================================================= */

function getMonday(date){

  const d =
    new Date(date);

  const day =
    d.getDay();

  const diff =
    day === 0
      ? -6
      : 1-day;

  d.setDate(
    d.getDate()+diff
  );

  d.setHours(
    0,0,0,0
  );

  return d;
}

function getCurrentWeekMonday(){

  const today =
    new Date();

  const monday =
    getMonday(today);

  monday.setDate(
    monday.getDate() +
    weekOffset*7
  );

  return monday;
}

function changeWeek(amount){

  weekOffset += amount;

  renderWeek();
}

/* =========================================================
   HOME

function renderHome(){

  const today =
    localDateString();

  const d =
    parseDate(today);

  const weekdays =
    [
      "日",
      "月",
      "火",
      "水",
      "木",
      "金",
      "土"
    ];

  const dateEl =
    document.getElementById(
      "homeDate"
    );

  const todayEl =
    document.getElementById(
      "homeToday"
    );

  if(dateEl){

    dateEl.textContent =
      `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${weekdays[d.getDay()]}）`;

  }

  if(todayEl){

    todayEl.textContent =
      "TODAY";
  }

  /* TODO */

  const openTodos =
    todos.filter(
      todo=>!todo.done
    );

  document.getElementById(
    "statTodo"
  ).textContent =
    openTodos.length;

  /* STUDY */

  const todayRecords =
    records.filter(
      record=>record.date === today
    );

  const studyMinutes =
    todayRecords.reduce(
      (sum,record)=>{

        const hours =
          Number(
            record.hours || 0
          );

        const minutes =
          Number(
            record.minutes || 0
          );

        return sum +
          hours*60 +
          minutes;

      },
      0
    );

  document.getElementById(
    "statStudy"
  ).textContent =
    studyMinutes >= 60
      ? `${Math.floor(studyMinutes/60)}h ${studyMinutes%60}m`
      : `${studyMinutes}m`;

  /* MONEY */

  const todayMoney =
    money
      .filter(item=>item.date === today)
      .reduce(
        (sum,item)=>
          sum + Number(item.price || 0),
        0
      );

  document.getElementById(
    "statMoney"
  ).textContent =
    "¥" +
    todayMoney.toLocaleString();

  /* EVENTS */

  const monday =
    getCurrentWeekMonday();

  /*
    HOMEではweekOffsetを使わず
    「今週」を表示する。
  */

  const currentMonday =
    getMonday(
      new Date()
    );

  const currentSunday =
    addDays(
      currentMonday,
      6
    );

  const weekEvents =
    events.filter(event=>{

      const d =
        parseDate(event.date);

      return d >= currentMonday &&
             d <= currentSunday;

    });

  document.getElementById(
    "statEvents"
  ).textContent =
    weekEvents.length;

  /* TODAY EVENTS */

  const eventContainer =
    document.getElementById(
      "homeEvents"
    );

  const todayEvents =
    getEventsForDate(today);

  if(!todayEvents.length){

    eventContainer.innerHTML =
      `<div class="empty">
        今日の予定はありません。
      </div>`;

  }else{

    eventContainer.innerHTML =
      todayEvents
        .map(event=>`

          <div
            class="home-item"
            onclick="openEventModal('${event.id}')"
          >

            <div class="home-item-title">
              ${escapeHtml(event.name || "無題")}
            </div>

            <div class="home-item-sub">

              ${
                event.allDay
                  ? "終日"
                  : escapeHtml(
                      event.time || ""
                    )
              }

              ${
                event.place
                  ? " · " +
                    escapeHtml(event.place)
                  : ""
              }

            </div>

          </div>

        `)
        .join("");

  }

  /* HOME TODO */

  const todoContainer =
    document.getElementById(
      "homeTodos"
    );

  const homeTodos =
    openTodos
      .slice()
      .sort(
        (a,b)=>
          Number(b.priority||0) -
          Number(a.priority||0)
      )
      .slice(0,5);

  if(!homeTodos.length){

    todoContainer.innerHTML =
      `<div class="empty">
        未完了のTODOはありません。
      </div>`;

  }else{

    todoContainer.innerHTML =
      homeTodos
        .map(todo=>`

          <div
            class="home-item"
            onclick="toggleTodo('${todo.id}')"
          >

            <div class="home-item-title">
              ${escapeHtml(todo.title || "無題")}
            </div>

            <div class="home-item-sub">

              ${
                "★".repeat(
                  Number(todo.priority || 0)
                )
              }

              ${
                todo.dueDate
                  ? " · " +
                    formatDateJP(todo.dueDate)
                  : ""
              }

            </div>

          </div>

        `)
        .join("");

  }

  /* HOME RECORD */

  const recordContainer =
    document.getElementById(
      "homeRecords"
    );

  const recentRecords =
    records
      .slice()
      .sort(sortByDateDesc)
      .slice(0,5);

  if(!recentRecords.length){

    recordContainer.innerHTML =
      `<div class="empty">
        まだ記録がありません。
      </div>`;

  }else{

    recordContainer.innerHTML =
      recentRecords
        .map(record=>`

          <div
            class="home-item"
            onclick="openRecordModal('${record.id}')"
          >

function renderWeekTodos(){

  const container =
    document.getElementById(
      "weekTodos"
    );

  const monday =
    getCurrentWeekMonday();

  const sunday =
    addDays(
      monday,
      6
    );

  const weekTodos =
    todos
      .filter(todo=>{

        if(!todo.dueDate){
          return false;
        }

        const d =
          parseDate(todo.dueDate);

        return d >= monday &&
               d <= sunday;

      })
      .sort((a,b)=>{

        return String(
          a.dueDate || ""
        ).localeCompare(
          String(b.dueDate || "")
        );

      });

  if(!weekTodos.length){

    container.innerHTML =
      `<div class="empty">
        今週期限のTODOはありません。
      </div>`;

    return;
  }

  container.innerHTML =
    weekTodos
      .map(
        todo=>todoHtml(todo)
      )
      .join("");

}

      0,
      Math.min(
        5,
        Number(todo.priority || 0)
      )
    );

  return `

    <div
      class="item ${todo.done ? "done" : ""}"
    >

      <div class="between">

        <div class="row">

          >

          <div class="item-title">
            ${escapeHtml(todo.title || "無題")}
          </div>

        </div>

        <div class="star">
          ${"★".repeat(priority)}
          ${"☆".repeat(5-priority)}
        </div>

      </div>

        todo.detail
          ? `
            <div class="item-detail">
              ${escapeHtml(todo.detail)}

      <div class="item-meta">

          todo.dueDate

async function saveTodo(){

  const title =
    document
      .getElementById("todoTitle")
      .value
      .trim();

  if(!title){

    alert(
      "TODOを入力してください。"
    );

    return;
  }

  const priority =
    Number(
      document
        .getElementById("todoPriority")
        .value
    );

  const dueDate =
    document
      .getElementById("todoDueDate")
      .value;

  const detail =
    document
      .getElementById("todoDetail")
      .value
      .trim();

  if(editingTodoId){

    const todo =
      todos.find(
        item=>item.id === editingTodoId
      );

    if(todo){

      todo.title = title;
      todo.priority = priority;
      todo.dueDate = dueDate;
      todo.detail = detail;

    }

  }else{

    todos.push({

      id:uid(),

      title:title,

      priority:priority,

      dueDate:dueDate,

      detail:detail,

      done:false,

      createdAt:
        new Date().toISOString()

    });

  }

  try{

    await saveAll();

    renderAll();

    closeModal();

  }catch(error){

    alert(
      error.message ||
      "保存に失敗しました。"
    );

  }

}

async function toggleTodo(id){

  const todo =
    todos.find(
      item=>item.id === id
    );

  if(!todo){
    return;
  }

  todo.done =
    !todo.done;

  try{

    await saveAll();

    renderAll();

  }catch(error){

    /*
      保存に失敗した場合は
      元に戻す。
    */

    todo.done =
      !todo.done;

    renderAll();

    alert(
      error.message ||
      "保存に失敗しました。"
    );

  }

}

async function deleteTodo(id){

  const ok =
    confirm(
      "このTODOを削除しますか？"
    );

  if(!ok){
    return;
  }

  const old =
    todos;

  todos =
    todos.filter(
      item=>item.id !== id
    );

  try{

    await saveAll();

    renderAll();

  }catch(error){

    todos = old;

    renderAll();

    alert(
      error.message ||
      "削除の保存に失敗しました。"
    );

  }

}

async function moveTodo(id,direction){

  const index =
    todos.findIndex(
      item=>item.id === id
    );

  if(index < 0){
    return;
  }

  const newIndex =
    index + direction;

  if(
    newIndex < 0 ||
    newIndex >= todos.length
  ){
    return;
  }

  [
    todos[index],
    todos[newIndex]
  ] =
  [
    todos[newIndex],
    todos[index]
  ];

  try{

    await saveAll();

    renderAll();

  }catch(error){

    /*
      保存失敗時は再読み込み。
    */

    await loadCloud();

    renderAll();

    alert(
      error.message ||
      "並び順の保存に失敗しました。"
    );

  }

}

function resizeImage(file){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();

      reader.onload =
        event=>{

          const img =
            new Image();

          img.onload =
            ()=>{

              const max =
                1000;

              let width =
                img.width;

              let height =
                img.height;

              if(width > max){

                height =
                  Math.round(
                    height * max / width
                  );

                width = max;

              }

              const canvas =
                document.createElement(
                  "canvas"
                );

              canvas.width =
                width;

              canvas.height =
                height;

              const ctx =
                canvas.getContext(
                  "2d"
                );

              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );

              resolve(
                canvas.toDataURL(
                  "image/jpeg",
                  .78
                )
              );

            };

          img.onerror =
            ()=>reject(
              new Error(
                "画像を読み込めませんでした。"
              )
            );

          img.src =
            event.target.result;

        };

      reader.onerror =
        ()=>reject(
          new Error(
            "画像ファイルを読み込めませんでした。"
          )
        );

      reader.readAsDataURL(file);

    }
  );
}

async function saveRecord(){

  const date =
    document
      .getElementById("recordDate")
      .value;

  let hours =
    Number(
      document
        .getElementById("recordHours")
        .value
    );

  let minutes =
    Number(
      document
        .getElementById("recordMinutes")
        .value
    );

  const note =
    document
      .getElementById("recordNote")
      .value
      .trim();

  const photoInput =
    document
      .getElementById("recordPhoto");

  if(!date){

    alert(
      "日付を入力してください。"
    );

    return;
  }

  if(
    !Number.isFinite(hours) ||
    hours < 0
  ){
    hours = 0;
  }

  if(
    !Number.isFinite(minutes) ||
    minutes < 0
  ){
    minutes = 0;
  }

  /*
    60分以上入力された場合に整理。
  */

  hours +=
    Math.floor(minutes / 60);

  minutes =
    minutes % 60;

  let photo = null;

  try{

    if(
      photoInput &&
      photoInput.files &&
      photoInput.files[0]
    ){

      photo =
        await resizeImage(
          photoInput.files[0]
        );

    }

    if(editingRecordId){

      const record =
        records.find(
          x=>x.id === editingRecordId
        );

      if(record){

        record.date = date;
        record.hours = hours;
        record.minutes = minutes;
        record.note = note;

        if(photo){
          record.photo = photo;
        }

      }

    }else{

      records.push({

        id:uid(),

        date:date,

        hours:hours,

        minutes:minutes,

        note:note,

        photo:photo,

        createdAt:
          new Date().toISOString()

      });

    }

    await saveAll();

    renderAll();

    closeModal();

  }catch(error){

    console.error(error);

    alert(
      error.message ||
      "記録の保存に失敗しました。"
    );

  }

}

function renderReceipt(){

  const container =
    document.getElementById(
      "receiptBody"
    );

  if(!container){
    return;
  }

  /*
    今週ではなく、
    現在表示しているWEEKの週を集計。
  */

  const monday =
    getCurrentWeekMonday();

  const sunday =
    addDays(
      monday,
      6
    );

  const weekEvents =
    events.filter(event=>{

      if(!event.date){
        return false;
      }

      const d =
        parseDate(event.date);

      return (
        d >= monday &&
        d <= sunday
      );

    });

  const weekTodos =
    todos.filter(todo=>{

      if(!todo.dueDate){
        return false;
      }

      const d =
        parseDate(todo.dueDate);

      return (
        d >= monday &&
        d <= sunday
      );

    });

  const doneTodos =
    weekTodos.filter(
      todo=>todo.done
    );

  const weekRecords =
    records.filter(record=>{

      if(!record.date){
        return false;
      }

      const d =
        parseDate(record.date);

      return (
        d >= monday &&
        d <= sunday
      );

    });

  const studyMinutes =
    weekRecords.reduce(
      (sum,record)=>{

        return sum +
          Number(record.hours || 0)*60 +
          Number(record.minutes || 0);

      },
      0
    );

  const weekMoney =
    money
      .filter(item=>{

        if(!item.date){
          return false;
        }

        const d =
          parseDate(item.date);

        return (
          d >= monday &&
          d <= sunday
        );

      })
      .reduce(
        (sum,item)=>
          sum + Number(item.price || 0),
        0
      );

  const studyText =
    studyMinutes >= 60
      ? `${Math.floor(studyMinutes/60)}h ${studyMinutes%60}m`
      : `${studyMinutes}m`;

  const username =
    currentUsername ||
    currentUser?.user_metadata?.username ||
    "USER";

  container.innerHTML = `

    <div class="receipt-header">

      <div class="receipt-title">
        MY LOG
      </div>

      <div
        class="muted"
        style="font-size:10px;margin-top:5px"
      >
        WEEKLY RECEIPT
      </div>

      <div
        style="font-size:10px;margin-top:10px"
      >
        ${escapeHtml(username)}
      </div>

    </div>

    <div class="receipt-row">

      <span>
        PERIOD
      </span>

      <span>
        ${formatDateJP(
          localDateString(monday)
        )}
        –
        ${formatDateJP(
          localDateString(sunday)
        )}
      </span>

    </div>

    <div class="receipt-row">

      <span>
        STUDY TIME
      </span>

      <span>
        ${studyText}
      </span>

    </div>

    <div class="receipt-row">

      <span>
        TODO DONE
      </span>

      <span>
        ${doneTodos.length}
        /
        ${weekTodos.length}
      </span>

    </div>

    <div class="receipt-row">

      <span>
        EVENTS
      </span>

      <span>
        ${weekEvents.length}
      </span>

    </div>

    <div class="receipt-row">

      <span>
        SPENDING
      </span>

      <span>
        ¥${weekMoney.toLocaleString()}
      </span>

    </div>

    <div
      class="receipt-total"
    >

      <div
        style="
          display:flex;
          justify-content:space-between;
        "
      >

        <span>
          WEEK TOTAL
        </span>

        <span>
          ${studyText}
        </span>

      </div>

    </div>

    <div
      style="
        text-align:center;
        color:#777;
        font-size:9px;
        margin-top:22px;
        padding-top:12px;
        border-top:1px dashed #aaa;
      "
    >

    </div>

  `;
}

/*
  HOMEなどから簡単に旧データ移行を呼べるように、
  MEMOページの下部に設定カードを追加。
*/

function renderMemoSettings(){

  const container =
    document.getElementById(
      "memoList"
    );

  if(!container){
    return;
  }

  /*
    既存のMEMO一覧の後ろに
    アカウント関連ボタンを追加。
  */

  const setting =
    document.createElement("div");

  setting.className =
    "card";

  setting.style.marginTop =
    "14px";

  setting.innerHTML = `

    <div class="card-title">
      DATA
    </div>

    <div class="muted small-text"
         style="margin-bottom:10px">

      この端末に残っている
      旧MY LOGデータを、
      現在のアカウントへ移行できます。

    </div>

    <div class="row wrap">

      <button
        class="btn light small"
        type="button"
        onclick="migrateOldData()"
      >
        旧データを移行
      </button>

    </div>

  `;

  container.appendChild(
    setting
  );

}

/* =========================================================
   ORIGINAL MEMO RENDER WRAPPER
========================================================= */

const originalRenderMemo =
  renderMemo;

renderMemo = function(){

  originalRenderMemo();

  renderMemoSettings();

};

/* =========================================================
   SUPABASE CONNECTION CHECK
========================================================= */

async function checkSupabaseConnection(){

  try{

    const {
      data,
      error
    } =
      await sb.auth.getSession();

    if(error){

      console.error(
        "SUPABASE SESSION ERROR",
        error
      );

      return;
    }

    if(data?.session?.user){

      /*
        セッションが残っていたら
        自動ログイン。
      */

      if(!currentUser){

        await enterApp(
          data.session.user
        );

      }

    }

  }catch(error){

    console.error(
      "SUPABASE CHECK ERROR",
      error
    );

  }

}

/* =========================================================
   VISIBILITY / RETURN FROM BACKGROUND
========================================================= */

document.addEventListener(
  "visibilitychange",
  async ()=>{

    if(
      document.visibilityState ===
      "visible"
    ){

      /*
        iPhoneで別アプリへ移動して戻ってきた
        ときにもセッションを確認。
      */

      if(currentUser){

        try{

          const {
            data,
            error
          } =
            await sb.auth.getSession();

          if(error){
            console.error(error);
            return;
          }

          if(
            data?.session?.user &&
            data.session.user.id ===
              currentUser.id
          ){

            /*
              最新データを取得。
            */

            await loadCloud();

            renderAll();

          }

        }catch(error){

          console.error(error);

        }

      }

    }

  }
);

/* =========================================================
   BEFORE UNLOAD
========================================================= */

window.addEventListener(
  "beforeunload",
  ()=>{
    /*
      保存処理そのものは各操作時に
      awaitしているため、
      ここでは無理に通信しない。
    */
  }
);

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  event=>{

    if(event.key === "Escape"){

      closeModal();

    }

  }
);

/* =========================================================
   INITIAL START
========================================================= */

async function startApp(){

  buildNav();

  /*
    まずログイン画面を表示。
  */

  document
    .getElementById("loginScreen")
    .style.display = "flex";

  document
    .getElementById("app")
    .style.display = "none";

  setSync("OFFLINE");

  await checkSupabaseConnection();

}

/* =========================================================
   START
========================================================= */

startApp();

/* =========================================================
   END JAVASCRIPT
========================================================= */

</script>

</body>
</html>
