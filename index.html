><!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<title>LIFE RECEIPT</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f3f2ee;
  --paper:#fffefa;
  --ink:#272727;
  --muted:#8b8984;
  --line:#d5d2cb;
  --soft:#f8f6f1;
  --accent:#f2dce4;
}
body{
  margin:0;
  background:
    radial-gradient(circle at 20% 10%,#ffffff 0 2px,transparent 3px),
    var(--bg);
  color:var(--ink);
  font-family:"Courier New",Courier,monospace;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{max-width:780px;margin:0 auto;padding:28px 14px 55px}
.receipt{
  position:relative;
  background:var(--paper);
  min-height:100vh;
  padding:34px 30px 46px;
  box-shadow:0 4px 18px rgba(0,0,0,.07);
}
.receipt:after{
  content:"";
  position:absolute;
  left:0;right:0;bottom:-7px;height:14px;
  background:
    linear-gradient(135deg,transparent 50%,var(--paper) 51%) 0 0/14px 14px repeat-x;
}
.header{
  text-align:center;
  border-bottom:1px dashed var(--line);
  padding-bottom:20px;
}
h1{
  display:inline-block;
  position:relative;
  font-size:27px;
  letter-spacing:3px;
  margin:0 0 9px;
  font-weight:700;
}
h1:after{
  content:"";
  position:absolute;
  z-index:-1;
  left:-4px;right:-4px;bottom:1px;height:9px;
  background:var(--accent);
  transform:rotate(-1deg);
}
.small{font-size:11px;color:var(--muted)}
.userbar{
  display:flex;justify-content:space-between;gap:10px;
  align-items:center;margin:15px 0 0;
}
button{
  border:1px solid #aaa7a0;
  background:#fffefa;
  color:var(--ink);
  padding:8px 12px;
  border-radius:3px;
}
button:hover{background:var(--soft)}
.nav{
  display:flex;justify-content:space-between;align-items:center;
  margin:21px 0 5px;
}
.nav button{border:0;background:transparent;font-size:19px;padding:8px}
.nav button:hover{background:var(--soft)}
.week{text-align:center;font-weight:bold;font-size:13px;letter-spacing:.5px}
section{
  border-bottom:1px dashed var(--line);
  padding:20px 0;
}
.section-title{
  display:flex;justify-content:space-between;align-items:center;
  font-weight:bold;letter-spacing:1.5px;margin-bottom:13px;
}
.add{
  font-size:11px;padding:5px 9px;
  border-color:#bbb7b0;
  border-radius:2px;
}
.day{margin:13px 0}
.day-title{font-weight:bold;margin-bottom:5px;font-size:12px}
.item{
  display:flex;gap:8px;align-items:flex-start;
  padding:7px 0;border-bottom:1px dotted #dedbd4;
}
.item .text{flex:1;white-space:pre-wrap;word-break:break-word}
.item.done .text{text-decoration:line-through;color:#aaa}
.delete{border:0;padding:0 4px;color:#aaa;background:transparent}
.money-row{
  display:flex;justify-content:space-between;gap:12px;
  padding:7px 0;border-bottom:1px dotted #dedbd4;
}
.total{
  font-weight:bold;border-top:1px solid #999;
  margin-top:7px;padding-top:9px;border-bottom:0;
}
.empty{color:#aaa;font-size:11px;padding:7px 0}
.memo{white-space:pre-wrap;word-break:break-word}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.stat{
  border:1px solid #d1cec7;
  background:#fffefa;
  padding:11px;
}
.stat span{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}
.stat b{font-size:17px}
footer{text-align:center;padding-top:26px;font-size:10px;color:#aaa;letter-spacing:1px}
.auth{
  max-width:430px;margin:55px auto;background:var(--paper);
  padding:32px 28px 30px;
  box-shadow:0 4px 18px rgba(0,0,0,.07);
}
.auth h1{display:block;text-align:center}
label{display:block;font-size:11px;margin:14px 0 5px}
input,textarea,select{
  width:100%;border:1px solid #c7c4bd;
  background:#fffefa;padding:10px;outline:none;border-radius:2px;
  color:var(--ink);
}
input:focus,textarea:focus,select:focus{border-color:#999}
textarea{min-height:100px;resize:vertical}
.form-actions{display:flex;gap:8px;margin-top:16px}
.form-actions button{flex:1}
.message{font-size:11px;margin-top:12px;min-height:18px;color:#777}
.hidden{display:none!important}
.modal{
  position:fixed;inset:0;background:rgba(40,40,40,.28);
  display:flex;align-items:center;justify-content:center;
  padding:18px;z-index:5;
}
.modal-box{
  background:var(--paper);width:min(500px,100%);
  padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.16);
}
.modal-title{font-weight:bold;letter-spacing:1px;margin-bottom:12px}
@media(max-width:520px){
  .app{padding:0}
  .receipt{padding:27px 17px 40px}
  .stats{grid-template-columns:1fr 1fr}
  h1{font-size:23px}
  .userbar{font-size:10px}
}
</style>
</head>
<body>

<div id="authView" class="auth">
  <h1>LIFE RECEIPT</h1>
  <p class="small" style="text-align:center">YOUR PERSONAL LIFE LOG</p>
  <label>EMAIL</label>
  <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
  <label>PASSWORD</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="6文字以上">
  <div class="form-actions">
    <button id="loginBtn">LOGIN</button>
    <button id="signupBtn">SIGN UP</button>
  </div>
  <div id="authMsg" class="message"></div>
</div>

<div id="appView" class="app hidden">
  <main class="receipt">
    <header class="header">
      <h1>LIFE RECEIPT</h1>
      <div id="today" class="small"></div>
      <div class="userbar">
        <span id="userEmail" class="small"></span>
        <button id="logoutBtn">LOGOUT</button>
      </div>
    </header>

    <div class="nav">
      <button id="prevWeek">←</button>
      <div id="weekLabel" class="week"></div>
      <button id="nextWeek">→</button>
    </div>

    <section>
      <div class="section-title">WEEKLY <button class="add" onclick="openModal('schedule')">＋ ADD</button></div>
      <div id="scheduleList"></div>
    </section>

    <section>
      <div class="section-title">TODO <button class="add" onclick="openModal('todo')">＋ ADD</button></div>
      <div id="todoList"></div>
    </section>

    <section>
      <div class="section-title">MONEY <button class="add" onclick="openModal('money')">＋ ADD</button></div>
      <div class="stats">
        <div class="stat"><span>INCOME</span><b id="income">¥0</b></div>
        <div class="stat"><span>EXPENSE</span><b id="expense">¥0</b></div>
      </div>
      <div class="money-row total"><span>BALANCE</span><span id="balance">¥0</span></div>
      <div id="moneyList"></div>
    </section>

    <section>
      <div class="section-title">STUDY <button class="add" onclick="openModal('study')">＋ ADD</button></div>
      <div class="stats">
        <div class="stat"><span>TODAY</span><b id="studyToday">0:00</b></div>
        <div class="stat"><span>THIS WEEK</span><b id="studyWeek">0:00</b></div>
      </div>
      <div id="studyList"></div>
    </section>

    <section>
      <div class="section-title">WISH <button class="add" onclick="openModal('wish')">＋ ADD</button></div>
      <div id="wishList"></div>
    </section>

    <section>
      <div class="section-title">MEMO <button class="add" onclick="openModal('memo')">＋ ADD</button></div>
      <div id="memoList"></div>
    </section>

    <footer>— KEEP YOUR LITTLE MOMENTS —</footer>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div id="modalTitle" class="modal-title"></div>
    <div id="modalFields"></div>
    <div class="form-actions">
      <button onclick="closeModal()">CANCEL</button>
      <button id="saveBtn">SAVE</button>
    </div>
    <div id="modalMsg" class="message"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://ncwyjaqjeoncjpohifwj.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_PgIOR1CkvKCpI14YC39Xtg_tlwJlQMk";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

let currentUser = null;
let weekStart = monday(new Date());
let modalType = null;
let currentItems = [];

const $ = id => document.getElementById(id);
const yen = n => "¥" + Number(n||0).toLocaleString("ja-JP");
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function monday(d){let x=new Date(d);x.setHours(0,0,0,0);let day=x.getDay();x.setDate(x.getDate()-(day===0?6:day-1));return x}
function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}
function fmtDate(d){return `${d.getMonth()+1}/${d.getDate()}`}
function fmtMinutes(m){m=Number(m||0);return `${Math.floor(m/60)}:${pad(m%60)}`}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function setAuthMsg(t){$("authMsg").textContent=t}
function setModalMsg(t){$("modalMsg").textContent=t}

$("loginBtn").onclick=async()=>{
  setAuthMsg("");
  const {error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
  if(error)setAuthMsg("ログインできませんでした: "+error.message);
};
$("signupBtn").onclick=async()=>{
  setAuthMsg("");
  const email=$("email").value.trim(), password=$("password").value;
  if(!email||password.length<6){setAuthMsg("メールアドレスと6文字以上のパスワードを入力してください。");return}
  const {error}=await db.auth.signUp({email,password});
  if(error)setAuthMsg("登録できませんでした: "+error.message);
  else setAuthMsg("登録しました。確認メールが届いた場合は、メールを確認してからLOGINしてください。");
};
$("logoutBtn").onclick=()=>db.auth.signOut();
$("prevWeek").onclick=()=>{weekStart=addDays(weekStart,-7);render()};
$("nextWeek").onclick=()=>{weekStart=addDays(weekStart,7);render()};

db.auth.onAuthStateChange(async(_event,session)=>{
  currentUser=session?.user||null;
  if(currentUser){
    $("authView").classList.add("hidden");
    $("appView").classList.remove("hidden");
    $("userEmail").textContent=currentUser.email||"";
    await render();
  }else{
    $("appView").classList.add("hidden");
    $("authView").classList.remove("hidden");
  }
});

async function loadItems(){
  const end=addDays(weekStart,7);
  const {data,error}=await db.from("life_items").select("*").eq("user_id",currentUser.id)
    .gte("item_date",iso(weekStart)).lt("item_date",iso(end)).order("item_date",{ascending:true}).order("created_at",{ascending:true});
  if(error){alert("データの読み込みに失敗しました: "+error.message);return []}
  return data||[];
}

async function render(){
  $("today").textContent=new Intl.DateTimeFormat("ja-JP",{dateStyle:"full"}).format(new Date());
  $("weekLabel").textContent=`${weekStart.getFullYear()}.${pad(weekStart.getMonth()+1)}.${pad(weekStart.getDate())} — ${addDays(weekStart,6).getFullYear()}.${pad(addDays(weekStart,6).getMonth()+1)}.${pad(addDays(weekStart,6).getDate())}`;
  currentItems=await loadItems();
  renderSchedule();renderTodo();renderMoney();renderStudy();renderWish();renderMemo();
}

function itemsByType(type){return currentItems.filter(x=>x.type===type)}
function dayItems(type,date){return itemsByType(type).filter(x=>x.item_date===iso(date))}

function renderSchedule(){
  let h="";
  for(let i=0;i<7;i++){
    const d=addDays(weekStart,i), arr=dayItems("schedule",d);
    h+=`<div class="day"><div class="day-title">${["MON","TUE","WED","THU","FRI","SAT","SUN"][i]} ${fmtDate(d)}</div>`;
    h+=arr.length?arr.map(x=>`<div class="item"><div class="text">${esc(x.title||x.content)}</div><button class="delete" onclick="removeItem('${x.id}')">×</button></div>`):`<div class="empty">—</div>`;
    h+="</div>";
  }
  $("scheduleList").innerHTML=h;
}
function renderTodo(){
  const arr=itemsByType("todo");
  $("todoList").innerHTML=arr.length?arr.map(x=>`<div class="item ${x.completed?"done":""}">
    <input type="checkbox" ${x.completed?"checked":""} onchange="toggleTodo('${x.id}',this.checked)">
    <div class="text">${esc(x.title||x.content)}</div><button class="delete" onclick="removeItem('${x.id}')">×</button>
  </div>`).join(""):`<div class="empty">TODOはありません。</div>`;
}
function renderMoney(){
  const arr=itemsByType("money"), income=arr.filter(x=>x.content==="income").reduce((s,x)=>s+Number(x.amount||0),0), expense=arr.filter(x=>x.content==="expense").reduce((s,x)=>s+Number(x.amount||0),0);
  $("income").textContent=yen(income);$("expense").textContent=yen(expense);$("balance").textContent=yen(income-expense);
  $("moneyList").innerHTML=arr.length?arr.map(x=>`<div class="money-row"><span>${esc(x.title)}</span><span>${x.content==="income"?"+":"−"}${yen(x.amount)} <button class="delete" onclick="removeItem('${x.id}')">×</button></span></div>`).join(""):`<div class="empty">記録はありません。</div>`;
}
function renderStudy(){
  const arr=itemsByType("study"), today=arr.filter(x=>x.item_date===iso(new Date())).reduce((s,x)=>s+Number(x.study_minutes||0),0), total=arr.reduce((s,x)=>s+Number(x.study_minutes||0),0);
  $("studyToday").textContent=fmtMinutes(today);$("studyWeek").textContent=fmtMinutes(total);
  $("studyList").innerHTML=arr.length?arr.map(x=>`<div class="money-row"><span>${fmtDate(new Date(x.item_date+"T00:00:00"))}　${esc(x.title||"")}</span><span>${fmtMinutes(x.study_minutes)} <button class="delete" onclick="removeItem('${x.id}')">×</button></span></div>`).join(""):`<div class="empty">勉強記録はありません。</div>`;
}
function renderWish(){
  const arr=itemsByType("wish");
  $("wishList").innerHTML=arr.length?arr.map(x=>`<div class="item ${x.completed?"done":""}"><input type="checkbox" ${x.completed?"checked":""} onchange="toggleTodo('${x.id}',this.checked)"><div class="text">${esc(x.title||x.content)}</div><button class="delete" onclick="removeItem('${x.id}')">×</button></div>`).join(""):`<div class="empty">WISHはまだありません。</div>`;
}
function renderMemo(){
  const arr=itemsByType("memo");
  $("memoList").innerHTML=arr.length?arr.map(x=>`<div class="item"><div class="text memo">${esc(x.content||x.title)}</div><button class="delete" onclick="removeItem('${x.id}')">×</button></div>`).join(""):`<div class="empty">メモはありません。</div>`;
}

function openModal(type){
  modalType=type;$("modal").classList.remove("hidden");setModalMsg("");
  const names={schedule:"NEW SCHEDULE",todo:"NEW TODO",money:"MONEY",study:"STUDY RECORD",wish:"NEW WISH",memo:"NEW MEMO"};
  $("modalTitle").textContent=names[type];
  let h="";
  if(type==="schedule")h=`<label>DATE</label><input id="fDate" type="date" value="${iso(new Date())}"><label>CONTENT</label><input id="fTitle" placeholder="例：数学の課題">`;
  if(type==="todo")h=`<label>CONTENT</label><input id="fTitle" placeholder="例：レポートを書く">`;
  if(type==="money")h=`<label>TYPE</label><select id="fMoneyType"><option value="expense">EXPENSE</option><option value="income">INCOME</option></select><label>NAME</label><input id="fTitle" placeholder="例：本"><label>AMOUNT</label><input id="fAmount" type="number" min="0" placeholder="1200">`;
  if(type==="study")h=`<label>DATE</label><input id="fDate" type="date" value="${iso(new Date())}"><label>SUBJECT</label><input id="fTitle" placeholder="例：数学"><label>MINUTES</label><input id="fMinutes" type="number" min="1" placeholder="60">`;
  if(type==="wish")h=`<label>WISH</label><input id="fTitle" placeholder="例：新しい本を買う">`;
  if(type==="memo")h=`<label>MEMO</label><textarea id="fContent" placeholder="自由に書いてください"></textarea>`;
  $("modalFields").innerHTML=h;
}
function closeModal(){$("modal").classList.add("hidden")}
$("saveBtn").onclick=saveItem;

async function saveItem(){
  setModalMsg("");
  let row={user_id:currentUser.id,type:modalType,title:null,content:null,item_date:iso(new Date()),amount:0,study_minutes:0,completed:false};
  if(modalType==="schedule"||modalType==="todo"||modalType==="wish"){row.title=$("fTitle").value.trim();if(modalType==="schedule")row.item_date=$("fDate").value}
  if(modalType==="money"){row.title=$("fTitle").value.trim();row.content=$("fMoneyType").value;row.amount=Number($("fAmount").value||0)}
  if(modalType==="study"){row.title=$("fTitle").value.trim();row.item_date=$("fDate").value;row.study_minutes=Number($("fMinutes").value||0)}
  if(modalType==="memo"){row.content=$("fContent").value.trim()}
  if((row.title===null||!row.title)&&modalType!=="memo" || (modalType==="memo"&&!row.content)){setModalMsg("内容を入力してください。");return}
  const {error}=await db.from("life_items").insert(row);
  if(error){setModalMsg("保存できませんでした: "+error.message);return}
  closeModal();await render();
}
async function removeItem(id){
  if(!confirm("この記録を削除しますか？"))return;
  const {error}=await db.from("life_items").delete().eq("id",id).eq("user_id",currentUser.id);
  if(error)alert("削除できませんでした: "+error.message);else await render();
}
async function toggleTodo(id,checked){
  const {error}=await db.from("life_items").update({completed:checked,updated_at:new Date().toISOString()}).eq("id",id).eq("user_id",currentUser.id);
  if(error)alert("更新できませんでした: "+error.message);else await render();
}
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
</script>
</body>
</html>
